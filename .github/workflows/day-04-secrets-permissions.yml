name: Day 04 - Secrets Permissions and Token
on:
  workflow_dispatch:
    inputs:
      create_test_issue:
        description: Create a labeled test issue
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  issues: write
jobs:
  security-lab:
    runs-on: ubuntu-latest
    steps:
      - name: Mask a generated non-production value
        run: |
          VALUE="temporary-lab-value-${GITHUB_RUN_ID}"
          echo "::add-mask::$VALUE"
          echo "Masked value: $VALUE"
      - name: Confirm secret availability without printing it
        env:
          LAB_SECRET: ${{ secrets.LAB_SECRET }}
        run: |
          if [ -z "$LAB_SECRET" ]; then
            echo "LAB_SECRET is not configured"
            exit 1
          fi
          echo "LAB_SECRET is configured; value was not printed"
      - name: Create a test issue with GitHub CLI
        if: ${{ inputs.create_test_issue }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue create \
            --title "GH-200 lab test issue $GITHUB_RUN_ID" \
            --body "Created by Day 4. This issue can be deleted after verification." \
            --label documentation
