name: Day 05 - Step and Job Outputs
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      package_name: ${{ steps.metadata.outputs.package_name }}
      build_date: ${{ steps.metadata.outputs.build_date }}
    steps:
      - name: Generate metadata
        id: metadata
        run: |
          echo "version=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "package_name=app-${GITHUB_RUN_NUMBER}.zip" >> "$GITHUB_OUTPUT"
      - name: Use step output
        run: echo "Version is ${{ steps.metadata.outputs.version }}"
  consume:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "version=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "package_name=app-${GITHUB_RUN_NUMBER}.zip" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
