name: Day 06 - Conditions and Expressions
on:
  workflow_dispatch:
    inputs:
      force_failure:
        description: Force a test failure
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  conditions:
    runs-on: ubuntu-latest
    steps:
      - name: Display event
        run: echo "Event is ${{ github.event_name }}"
      - name: Optional failure
        if: ${{ inputs.force_failure }}
        run: exit 1
      - name: Runs after success
        if: ${{ success() }}
        run: echo "Previous steps succeeded"
      - name: Runs after failure
        if: ${{ failure() }}
        run: echo "A previous step failed"
      - name: Cleanup always runs
        if: ${{ always() }}
        run: echo "Cleanup executed"
      - name: Version tag example
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: echo "Version tag detected"
      - name: Only on main
        if: ${{ github.ref_name == 'main' }}
        run: echo "Running on the main branch"