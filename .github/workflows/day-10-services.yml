name: Day 10 - Service Containers
on: workflow_dispatch
permissions:
  contents: read
jobs:
  redis-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Install Redis client
        run: sudo apt-get update && sudo apt-get install -y redis-tools
      - name: Test Redis
        run: |
          redis-cli -h 127.0.0.1 -p 6379 SET lab-day10 complete
          test "$(redis-cli -h 127.0.0.1 -p 6379 GET lab-day10)" = "complete"
