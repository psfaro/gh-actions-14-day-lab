name: Day 12 - GitHub CLI and REST API
on: workflow_dispatch
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: List recent workflow runs with GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh run list --limit 5
      - name: Query repository through REST API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}" \
            --jq '{name: .name, visibility: .visibility, default_branch: .default_branch}'
